name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate JSON
        run: find . -name '*.json' -not -path './.git/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 jq -e . >/dev/null
      - name: Lint shell
        run: shellcheck block-self-bind-schedule/hooks/*.sh test/*.sh
      - name: Run tests
        run: test/run.sh

  pr-visuals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pr-visuals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pr-visuals/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run tests
        run: npm test
