# Copy to .github/workflows/pr-visuals.yml.
#
# Edit before use: replace REPLACE_WITH_FULL_COMMIT_SHA with the full commit SHA of the
# pr-visuals-vX.Y.Z tag of tonytino/agent-kit. The workflow fails until you do.
#
# Make "pr-visuals-check" a required status check.
#
# Labels:
#   visuals:none         The PR has no UI change. The check passes.
#   visuals:generate     Capture visuals and write them into the PR description. The job removes the label.
#   visuals:still-valid  Confirm the latest capture for the current head commit. The job removes the label.
#
# A label removed with GITHUB_TOKEN does not start a new workflow run. For this reason the check job
# runs in the same run, after generate and still-valid.
# Fork PRs get a read-only token. generate and still-valid do not work for fork PRs.
name: pr-visuals

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions: {}

jobs:
  generate:
    if: github.event.action == 'labeled' && github.event.label.name == 'visuals:generate'
    runs-on: ubuntu-latest
    # One writer per PR. queue: max keeps every pending run, so no label request is dropped.
    concurrency:
      group: pr-visuals-write-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      contents: write
      pull-requests: write
      issues: write
      deployments: read
    env:
      # Optional. JSON object of headers, sent only to the before and after origins.
      # With "after.source": "github-deployment", the config must set "after.environment".
      # Example secret value: {"x-vercel-protection-bypass":"...","x-vercel-set-bypass-cookie":"true"}
      PR_VISUALS_HEADERS: ${{ secrets.PR_VISUALS_HEADERS }}
    steps:
      - uses: tonytino/agent-kit/pr-visuals@REPLACE_WITH_FULL_COMMIT_SHA # pr-visuals-v0.1.0
        with:
          mode: generate

  still-valid:
    if: github.event.action == 'labeled' && github.event.label.name == 'visuals:still-valid'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-visuals-write-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: tonytino/agent-kit/pr-visuals@REPLACE_WITH_FULL_COMMIT_SHA # pr-visuals-v0.1.0
        with:
          mode: still-valid

  check:
    name: pr-visuals-check
    needs: [generate, still-valid]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The check reads the current PR state, so a newer check can replace an older one.
    concurrency:
      group: pr-visuals-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: read
      issues: read
    steps:
      - uses: tonytino/agent-kit/pr-visuals@REPLACE_WITH_FULL_COMMIT_SHA # pr-visuals-v0.1.0
        with:
          mode: check
