name: pr-visuals
description: Gate pull requests on before/after Playwright screenshots and videos in the PR description, driven by labels.
author: tonytino

inputs:
  mode:
    description: "check, generate, or still-valid."
    required: true
  config:
    description: Path to the config file in the repository. Read from the PR base branch.
    required: false
    default: .github/pr-visuals.json
  github-token:
    description: Token for the GitHub API and for pushing to the pr-visuals branch.
    required: false
    default: ${{ github.token }}
  bot-login:
    description: Account whose result comments the check trusts. Set it when github-token belongs to a GitHub App. Only GitHub App (Bot) accounts are supported.
    required: false
    default: github-actions[bot]

runs:
  using: composite
  steps:
    - name: Check mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in
          check|generate|still-valid) ;;
          *) echo "::error title=pr-visuals::mode must be check, generate, or still-valid."; exit 1 ;;
        esac

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    # Uses only Node.js built-ins, so it runs before npm ci and reports even if the install fails.
    - name: Acknowledge label
      id: begin
      if: inputs.mode != 'check'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/cli/pr-visuals.mjs" begin "$MODE"

    - name: Install pr-visuals
      if: inputs.mode == 'generate'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund

    - name: Read Playwright version
      id: playwright
      if: inputs.mode == 'generate'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: echo "version=$(node -p 'require("./package.json").dependencies.playwright')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: inputs.mode == 'generate'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

    - name: Install Chromium
      if: inputs.mode == 'generate'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npx --no-install playwright install --with-deps chromium

    - name: Run pr-visuals
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_VISUALS_CONFIG: ${{ inputs.config }}
        PR_VISUALS_BOT_LOGIN: ${{ inputs.bot-login }}
        PR_VISUALS_COMMENT_ID: ${{ steps.begin.outputs.comment-id }}
        PR_VISUALS_BEGUN: ${{ steps.begin.outcome == 'success' && '1' || '' }}
      run: node "$GITHUB_ACTION_PATH/cli/pr-visuals.mjs" "$MODE"

    - name: Report failure
      if: failure() && inputs.mode != 'check'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_VISUALS_COMMENT_ID: ${{ steps.begin.outputs.comment-id }}
      run: node "$GITHUB_ACTION_PATH/cli/pr-visuals.mjs" report-failure "$MODE"
